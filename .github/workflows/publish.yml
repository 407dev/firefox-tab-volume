name: Publish to AMO

# Triggered by publishing a GitHub Release. The release's tag must be
# "v<manifest version>" (e.g. v1.0.4 for manifest.json version "1.0.4").
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify release tag matches manifest version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build extension package
        run: ./build.sh

      - name: web-ext lint
        uses: kewisch/action-web-ext@v2
        with:
          cmd: lint
          source: .
          channel: listed
          # Lint only what build.sh ships. web-ext's API (which this action
          # calls) doesn't read .web-extignore, so the list lives here.
          ignoreFiles: '["build.sh", "README.md", "LICENSE", "tab-volume-control.zip"]'

      - name: web-ext sign
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: tab-volume-control.zip
          channel: listed
          releaseNotes: ${{ github.event.release.body }}
          # AMO reviews listed submissions on its own schedule (minutes to
          # days) — don't burn Actions minutes polling for that; the
          # submission is already queued once this step succeeds. Check
          # review status on the AMO developer dashboard.
          approvalTimeout: 0
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}

      - name: Attach built package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tab-volume-control.zip --clobber
